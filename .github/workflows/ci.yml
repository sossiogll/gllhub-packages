name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: gllhub-packages
      - uses: actions/checkout@v4
        with:
          repository: sossiogll/gll-hub
          ref: next
          path: gll-hub
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --no-progress
        working-directory: gllhub-packages
      - run: vendor/bin/phpunit
        working-directory: gllhub-packages
