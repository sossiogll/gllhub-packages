name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: gllhub-packages
      - uses: actions/checkout@v4
        with:
          repository: sossiogll/gll-hub
          ref: next
          path: gll-hub
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --no-progress
        working-directory: gllhub-packages
      - run: vendor/bin/phpunit
        working-directory: gllhub-packages

  # The action run as a repository would run it, on a file it must accept and on one it must refuse.
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./github/action
        with:
          directory: github/tests/fixtures/action/good
      - id: bad
        uses: ./github/action
        continue-on-error: true
        with:
          directory: github/tests/fixtures/action/bad
      - name: The bad file must have failed
        shell: bash
        env:
          OUTCOME: ${{ steps.bad.outcome }}
        run: test "$OUTCOME" = failure
